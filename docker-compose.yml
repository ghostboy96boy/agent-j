# Agent J regtest lab: bitcoind + alice (LND) + bob (LND) + carol (Core Lightning).
# Regtest only. Never point this at mainnet.
name: agent-j

services:
  bitcoind:
    image: ${BITCOIND_IMAGE}
    container_name: agentj-bitcoind
    user: root
    entrypoint: ["bitcoind"]
    command:
      - -datadir=/data
      - -printtoconsole=1
      - -regtest=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -rpcuser=${BTC_RPC_USER}
      - -rpcpassword=${BTC_RPC_PASS}
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -zmqpubrawblock=tcp://0.0.0.0:28334
      - -zmqpubrawtx=tcp://0.0.0.0:28335
      - -dnsseed=0
      - -listenonion=0
    volumes:
      - bitcoind:/data
    restart: unless-stopped

  alice:
    image: ${LND_IMAGE}
    container_name: agentj-alice
    depends_on: [bitcoind]
    command:
      - --noseedbackup
      - --alias=alice
      - --listen=0.0.0.0:9735
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --tlsextradomain=alice
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind
      - --bitcoind.rpcuser=${BTC_RPC_USER}
      - --bitcoind.rpcpass=${BTC_RPC_PASS}
      - --bitcoind.zmqpubrawblock=tcp://bitcoind:28334
      - --bitcoind.zmqpubrawtx=tcp://bitcoind:28335
      - --trickledelay=1000
      - --accept-keysend
    volumes:
      - alice:/root/.lnd
    ports:
      - "127.0.0.1:10009:10009"
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  bob:
    image: ${LND_IMAGE}
    container_name: agentj-bob
    depends_on: [bitcoind]
    command:
      - --noseedbackup
      - --alias=bob
      - --listen=0.0.0.0:9735
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --tlsextradomain=bob
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind
      - --bitcoind.rpcuser=${BTC_RPC_USER}
      - --bitcoind.rpcpass=${BTC_RPC_PASS}
      - --bitcoind.zmqpubrawblock=tcp://bitcoind:28334
      - --bitcoind.zmqpubrawtx=tcp://bitcoind:28335
      - --trickledelay=1000
      - --accept-keysend
    volumes:
      - bob:/root/.lnd
    ports:
      - "127.0.0.1:10010:10009"
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  carol:
    image: ${CLN_IMAGE}
    container_name: agentj-carol
    depends_on: [bitcoind]
    command:
      - --network=regtest
      - --alias=carol
      - --addr=0.0.0.0:9735
      - --bitcoin-rpcconnect=bitcoind
      - --bitcoin-rpcport=18443
      - --bitcoin-rpcuser=${BTC_RPC_USER}
      - --bitcoin-rpcpassword=${BTC_RPC_PASS}
      - --log-level=info
    volumes:
      - carol:/root/.lightning
    restart: unless-stopped

  # ---- Lightning Agent Kit L402 stack (profile "lak"; start with `make up-lak`) ----
  weatherln:
    image: ${WEATHERLN_IMAGE:-python:3.12-alpine}
    container_name: agentj-weatherln
    profiles: ["lak"]
    command: ["python", "-m", "http.server", "8000", "--directory", "/srv"]
    volumes:
      - ./lab/weatherln:/srv:ro
    restart: unless-stopped

  aperture:
    image: ${APERTURE_IMAGE:-lightninglabs/aperture:v0.4.3}
    container_name: agentj-aperture
    profiles: ["lak"]
    depends_on: [bob, weatherln]
    entrypoint: ["aperture"]
    command: ["--configfile=/config/aperture.yaml"]
    volumes:
      - ./lab/aperture/aperture.yaml:/config/aperture.yaml:ro
      - bob:/lnd:ro
      - aperture:/root/.aperture
    ports:
      - "127.0.0.1:8085:8081"
    restart: unless-stopped

volumes:
  bitcoind:
  alice:
  bob:
  carol:
  aperture:
